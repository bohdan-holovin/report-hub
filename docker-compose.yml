services:

  report-hub:
    build: .
    container_name: report-hub
    depends_on:
      - postgres-db
      - mongo-db
    ports:
      - target: 8080
        published: 8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/reporthub
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_MONGODB_URI=mongodb://admin:admin@mongo-db:27017/reporthub?authSource=admin

  postgres-db:
    image: postgres:16.1
    container_name: postgres-db
    ports:
      - target: 5432
        published: 5432
    environment:
      - POSTGRES_DB=reporthub
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-db:
    image: mongo:7.0.6
    container_name: mongo-db
    ports:
      - target: 27017
        published: 27017
    environment:
      - MONGO_INITDB_DATABASE=reporthub
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    healthcheck:
      test: [ "CMD", "mongosh", "--username", "admin", "--password", "admin", "--authenticationDatabase", "admin", "--eval", "db.runCommand({ ping: 1 })", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
